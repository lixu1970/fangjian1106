<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f8;color:#111;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:auto;padding:10px}
h1{font-size:25px;text-align:center;margin:8px 0 6px}
.sub{text-align:center;font-size:13px;color:#64748b;margin:0 0 4px}
.legend{text-align:center;font-size:12px;color:#8b95a5;margin:0 0 10px;line-height:1.5}
.legend b{font-weight:400;background:#e4dfec;padding:0 4px;border-radius:3px;color:#3b2f52}
.tablebox{overflow-x:auto;background:white;border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{border:1px solid #999;text-align:center;padding:5px 4px;font-size:16px}
th{position:sticky;top:0;background:#ffe95a;z-index:2;font-weight:700}
col.c1{width:11%}
col.c2{width:7%}
col.c3{width:19%}
col.c4,col.c5,col.c6,col.c7,col.c8{width:12.6%}
td.group{font-weight:700;background:#ebf1de;white-space:normal;line-height:1.3;font-size:15px;vertical-align:middle}
td.seq{font-weight:600;color:#334155;background:#fff}
td.name{font-weight:600;white-space:nowrap}
td.name.tone-g{background:#ebf1de}
td.name.tone-p{background:#e4dfec}
td.name.red{color:#ff0000}
td.cell{padding:2px 0}
button.check{width:36px;height:38px;border:0;background:transparent;font-size:27px;line-height:1;cursor:pointer;border-radius:8px;padding:0}
button.check[data-task="1"]{color:#d62828}
button.check[data-task="2"]{color:#1565c0}
button.check[data-task="3"]{color:#16833a}
button.check[data-task="4"]{color:#e87500}
button.check[data-task="5"]{color:#7b2cbf}
button.check.done{background:#e9f8ed}
.summary{margin-top:14px;background:white;border-radius:12px;padding:10px}
.task-summary{border-bottom:1px solid #ddd;padding:5px 0 9px}
.task-summary:last-child{border-bottom:0}
.summary-row{display:grid;grid-template-columns:70px minmax(0,1.18fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.78fr);gap:4px;align-items:stretch;margin:8px 0}
.summary-row strong{font-size:15px;text-align:center;align-self:center}
.summary-row button{min-width:0;min-height:44px;border:1px solid #aaa;border-radius:9px;font-size:13px;font-weight:700;padding:2px;line-height:1.2;word-break:keep-all}
.toggle-all{background:#fff}
.stat.done{background:#eaf8ee;border-color:#82c796!important}
.stat.undone{background:#fff1df;border-color:#e8aa5e!important}
.name-list{display:none;margin:5px 2px 0;padding:7px 8px;background:#f8fafc;border:1px solid #e4e8ee;border-radius:7px;font-size:14px;line-height:1.65;text-align:left;word-break:break-all}
.name-list b{white-space:nowrap}
.name-list span{color:#334155}
@media(max-width:600px){
 .wrap{padding:2px} h1{font-size:21px;margin:6px 0 4px}
 .sub{font-size:11px} .legend{font-size:10.5px;margin-bottom:6px}
 th,td{font-size:11px;padding:3px 0}
 th{padding:4px 0}
 col.c1{width:48px}
 col.c2{width:24px}
 col.c3{width:48px}
 col.c4,col.c5,col.c6,col.c7,col.c8{width:37px}
 th:nth-child(n+4){font-size:10px;letter-spacing:-1px}
 td.group{font-size:10px;letter-spacing:-.5px;line-height:1.25}
 td.cell{padding:1px 0}
 button.check{width:30px;height:32px;font-size:21px}
 .summary{padding:8px}
 .summary-row{grid-template-columns:54px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.72fr);gap:3px}
 .summary-row strong{font-size:12px}
 .summary-row button{font-size:11px;padding:1px;letter-spacing:-.5px;min-height:40px}
 .name-list{font-size:13px;padding:6px}
}
</style>
</head>

<script>
const KEY='clothing_practice_custom_room_261017_v12';
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){state={}}
const checks=[...document.querySelectorAll('.check')];
let visibleMode={1:null,2:null,3:null,4:null,5:null};
function k(b){return b.dataset.person+'-'+b.dataset.task}
function renderButton(b){
 const on=!!state[k(b)];
 b.textContent=on?'✅':'□';
 b.classList.toggle('done',on);
 b.setAttribute('aria-pressed',on?'true':'false');
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function taskButtons(t){return checks.filter(b=>+b.dataset.task===t)}
function personLabel(b){
 const name=b.getAttribute('aria-label').replace(/ (工服上衣|工服裤|返厂改|退订|其他)$/,'');
 return b.dataset.room+' '+name;
}
function updateStats(){
 for(let t=1;t<=5;t++){
  const arr=taskButtons(t);
  const done=arr.filter(b=>!!state[k(b)]).length;
  const d=document.getElementById('done'+t), u=document.getElementById('undone'+t);
  if(d) d.textContent=`完成（${done}）人`;
  if(u) u.textContent=`未完成（${arr.length-done}）人`;
 }
}
function renderList(t){
 const box=document.getElementById('list'+t),mode=visibleMode[t];
 if(!mode){box.style.display='none';return}
 const wantDone=mode==='done';
 const names=taskButtons(t).filter(b=>!!state[k(b)]===wantDone).map(personLabel);
 box.querySelector('b').textContent=wantDone?'已完成：':'未完成：';
 box.querySelector('span').textContent=names.length?names.join('、'):(wantDone?'暂无完成人员':'全部完成');
 box.style.display='block';
}
function showDone(t){visibleMode[t]='done';updateStats();renderList(t)}
function showUndone(t){visibleMode[t]='undone';updateStats();renderList(t)}
function refreshTask(t){updateStats();renderList(t)}
function toggleAllTask(t){
 const arr=taskButtons(t),allDone=arr.every(b=>!!state[k(b)]);
 arr.forEach(b=>{
  if(allDone) delete state[k(b)]; else state[k(b)]=true;
  renderButton(b);
 });
 save();updateStats();renderList(t);
}
checks.forEach(b=>{
 renderButton(b);
 b.addEventListener('click',()=>{
  state[k(b)]=!state[k(b)];
  if(!state[k(b)]) delete state[k(b)];
  renderButton(b);save();updateStats();renderList(+b.dataset.task);
 });
});
updateStats();
</script>
